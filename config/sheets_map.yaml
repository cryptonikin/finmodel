# Контракт листов (TASK_F0 §5, §10.1, §11.1). Колонки — только по заголовку, никогда по букве.
# ID таблиц здесь НЕТ: только имена env-переменных (значения — в D:\finmodel\secrets\finmodel.env).
#
# Поля листа:
#   alias, spreadsheet, title       — обязательные
#   header_row / data_from          — строка заголовков и первая строка данных (null — лист из блоков, без шапки)
#   key                             — ключевая колонка: конец данных = последняя непустая строка в ней
#   required                        — обязательные колонки; строка или {name, occurrence} для повторяющихся заголовков
#   writers                         — кто пишет колонку: owner | formula | apps_script | n8n | finmodel
#                                     (Ф0: только документация). Повторяющийся заголовок: {writer: …, occurrence: N}
#   optional: true                  — отсутствие листа — предупреждение, а не ошибка
#   writer_future                   — заметка о будущем писателе (документация)
#
# Сверено с docs/SHEETS_INTERFACE_v1.8.md (06.11.2026): §1 (поиск по заголовку), §3 (писатели), §4 (Теги_видео v3),
# изменения 22.10–06.11. Писатель — тот, кто пишет колонку ОСНОВНО; смешанные случаи помечены «также: …».
# Цвета зон (§1.3): ярко/светло-жёлтый = owner (код не пишет никогда); серый «авто» = formula или apps_script.

version: 1

spreadsheets:
  invest: {env: SHEET_INVEST_ID, title: "Расчет инвестиций"}
  budget: {env: SHEET_BUDGET_ID, title: "Бюджет и инвестиции - ai"}

sheets:
  - alias: journal
    spreadsheet: invest
    title: "Журнал"
    header_row: 4
    data_from: 5
    key: "ID"
    writer_future: "Ф1: только новые строки в существующие пустые строки с формулами"
    required: ["ID", "Дата", "Брокер", "Операция", "Тикер / код MOEX", "ISIN", "ID идеи", "Класс", "Кол-во",
               "Цена (облиг. — % ном.) / сумма", "НКД", "Денежный поток, ₽", "Комиссия, ₽", "Площадка",
               "Сделок в строке", "Источник", "Статус / примечание", "Вывод / урок"]
    # SHEETS_INTERFACE §3.3: строки 5…граница — история из отчётов (не трогать); граница ручного ввода — первая строка,
    # где в A формула с "M-" (изм. v1.29, не фиксированная 95). Строки «Архив: итог» (ARCH-…) — не сделки.
    writers:
      # формула для ручных строк (M-…); история из отчётов — значения T-…; Ф1 — finmodel пишет T-… целиком
      "ID": formula
      # вводимые колонки (владелец; в Ф1 — также finmodel для строк T-API)
      "Дата": owner
      "Брокер": owner
      "Операция": owner
      "Тикер / код MOEX": owner
      "Кол-во": owner
      "Цена (облиг. — % ном.) / сумма": owner
      "НКД": owner
      "Комиссия, ₽": owner
      "Источник": owner
      "Статус / примечание": owner
      "Вывод / урок": owner
      # формульные колонки (TASK_F1 §7.4)
      "ISIN": formula
      "ID идеи": formula
      "Класс": formula
      "Денежный поток, ₽": formula
      "Площадка": formula
      "Сделок в строке": formula

  - alias: stocks
    spreadsheet: invest
    title: "Акции"
    header_row: 4
    data_from: 5
    key: "Тикер (ввод)"
    required: ["№", "Тикер (ввод)", "Название", "Цена", "Оценка 0–100", "Тренд", "SMA50", "SMA200", "RSI14",
               "ATR14, %", "Дивдох. 12м", "В портфеле",
               {name: "P/E", occurrence: 1}, {name: "EV/EBITDA", occurrence: 1},
               {name: "Долг/EBITDA", occurrence: 1}]   # повторяются во 2-м блоке (баллы) — берём первый (значения ФА)
    writers:
      "№": formula                      # изм. 22.10: только формулы
      "Действие": formula               # изм. 22.10: только формулы
      "Тикер (ввод)": owner             # ввод (изм. 25.10); также: apps_script добавляет тикеры (syncIdeasFromTags_, автоидеи)
      "Дата добавления / смены действия (авто)": apps_script   # колонка E, изм. 06.11 (moex_sync 1.49)
      # ТА — apps_script (§3.2; потом finmodel)
      "SMA50": apps_script
      "SMA200": apps_script
      "RSI14": apps_script
      "ATR14, %": apps_script
      "SMA50 10 дн назад": apps_script          # изм. 31.10
      "MACD нед. сейчас": apps_script           # изм. 31.10
      "MACD нед. неделей ранее": apps_script    # изм. 31.10
      "RSI нед.": apps_script                   # изм. 31.10
      # ФА — apps_script (smart-lab), первое вхождение заголовка; второе — баллы (формулы)
      "P/E": {writer: apps_script, occurrence: 1}
      "EV/EBITDA": {writer: apps_script, occurrence: 1}
      "Долг/EBITDA": {writer: apps_script, occurrence: 1}
      "Не обновлять ФА": owner
      "Комментарий": owner
      # формулы (§3.2): Название, Цена, Тренд, Дивдох., Оценка, Рекомендация, В портфеле
      "Название": formula
      "Цена": formula
      "Тренд": formula
      "Дивдох. 12м": formula
      "Оценка 0–100": formula
      "В портфеле": formula

  - alias: bonds
    spreadsheet: invest
    title: "Облигации"
    header_row: 4
    data_from: 5
    key: "ID (авто)"
    required: ["ID (авто)", "Выпуск — ввод", "YTM (Справочник)", "Купон: фикс / флоатер (MOEX)",
               "Дюрация, лет (Справочник)", "Код MOEX (авто)", "ISIN (Справочник)"]
    # изм. 22.10: «ID (авто)» — скрытая колонка B, ключ связи с «Журналом»; формулы в D–AA, AC–AL, AN–AR (v1.26;
    # буквы с тех пор сдвинуты — ориентир по заголовкам)
    writers:
      "№": formula
      "ID (авто)": apps_script          # assignIds_
      "Выпуск — ввод": owner
      "Дата добавления (авто)": apps_script   # изм. 25.10
      "YTM (Справочник)": formula
      "Купон: фикс / флоатер (MOEX)": formula   # VLOOKUP из «Справочника», изм. 29.10
      "Дюрация, лет (Справочник)": formula
      "Код MOEX (авто)": formula
      "ISIN (Справочник)": formula

  - alias: ideas
    spreadsheet: invest
    title: "Идеи"
    header_row: 4
    data_from: 5
    key: "ID (авто)"
    required: ["ID (авто)", "Инструмент — ввод", "Статус (авто)", "Дата идеи", "Цель", "Стоп", "Горизонт, мес",
               "Тикер (авто)", "Версия (авто)"]
    writers:                            # §3.1
      "ID (авто)": apps_script          # новым строкам; постоянный
      "Инструмент — ввод": owner        # также: apps_script из тегов (syncIdeasFromTags_)
      "Дата идеи": owner                # также: apps_script 1.47 ставит «сегодня» при правке Цели/Стопа/…
      "Цель": owner                     # также: apps_script из тегов, только в пустые
      "Стоп": owner
      "Горизонт, мес": owner
      "Статус (авто)": formula
      "Тикер (авто)": formula
      "Версия (авто)": formula

  - alias: reference
    spreadsheet: invest
    title: "Справочник"
    header_row: 3
    data_from: 4
    key: "Тикер (как в листах)"
    required: ["Тикер (как в листах)", "SECID MOEX", "ISIN", "Название", "Тип", "Класс модели",
               "MOEX engine", "MOEX market", "MOEX board", "Цена (акции — ₽, облигации — % ном.)", "Цена обновлена"]
    writers:
      # §3.4: A тикер (владелец/скрипт); B–K серо-голубые (скрипт, если пусто); L Синонимы, AA Рейтинг (владелец);
      # M–Z серые (скрипт: цены ежедневно, данные по вс); AB «Тип купона (MOEX, авто)» (изм. 29.10)
      "Тикер (как в листах)": owner     # строка ищется по тикеру (A); также: apps_script
      "Синонимы": owner
      "Тип купона (MOEX, авто)": apps_script
      "SECID MOEX": apps_script
      "ISIN": apps_script
      "Название": apps_script
      "Тип": apps_script
      "MOEX engine": apps_script
      "MOEX market": apps_script
      "MOEX board": apps_script
      "Цена (акции — ₽, облигации — % ном.)": apps_script
      "Цена обновлена": apps_script

  - alias: candidates
    spreadsheet: invest
    title: "Кандидаты в идеи"
    header_row: 4
    data_from: 5
    key: "Тикер / ISIN"
    required: ["✔ В идеи", "✖ Отклонить", "Дата", "Тикер / ISIN", "Балл 0–100", "Статус"]
    writers:                            # изм. 22.10 23:30: A/B — флажки владельца, остальное — autoideas, только значения
      "✔ В идеи": owner
      "✖ Отклонить": owner
      "Дата": apps_script
      "Тикер / ISIN": apps_script
      "Балл 0–100": apps_script
      "Статус": apps_script

  - alias: video_tags
    spreadsheet: invest
    title: "Теги_видео"
    header_row: 1
    data_from: 2
    key: "ID (hash)"
    # §4 схема v3: все обязательные колонки («Тикер (по Справочнику)» — обязателен для акций)
    required: ["ID (hash)", "Дата загрузки", "Дата видео", "Автор / канал", "Ссылка", "Кусок", "Тип", "Класс",
               "Инструмент (как в видео)", "Тикер (по Справочнику)", "Тональность (−2…+2)", "Тезис", "Сценарий",
               "Качество распознавания", "Тип данных", "Статус проверки", "Модель LLM", "Версия промта"]
    writers:                            # теги пишет n8n (транскрибация), перезапись по ID
      "ID (hash)": n8n
      "Дата видео": n8n
      "Автор / канал": n8n
      "Тикер (по Справочнику)": n8n
      "Тональность (−2…+2)": n8n
      "Тезис": n8n

  - alias: docker_settings
    spreadsheet: invest
    title: "Docker: настройки"
    header_row: 1
    data_from: 2
    key: "Параметр"
    optional: true                       # лист создаст архитектор после приёмки Ф0 (в SHEETS_INTERFACE v1.8 его ещё нет)
    required: ["Параметр", "Значение", "Описание", "Допустимые значения"]
    writers:
      "Параметр": owner
      "Значение": owner
      "Описание": owner
      "Допустимые значения": owner

  - {alias: model, spreadsheet: invest, title: "Модель доходности", header_row: null}   # блоки, без шапки
  - {alias: scoring, spreadsheet: invest, title: "Скоринг", header_row: null}
  - {alias: budget_m, spreadsheet: budget, title: "10.26 вар.3", header_row: null}
