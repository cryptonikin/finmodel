[project]
name = "finmodel"
version = "0.1.1"
description = "Финмодель: проверка Google Таблиц, импорт Т-Банка, расчёты (Docker)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # кириллица и типографика в строках/комментариях — норма для проекта
  "S101",                        # assert в тестах
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true
